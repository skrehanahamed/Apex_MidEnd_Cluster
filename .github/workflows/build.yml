name: Qt 6 Build & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (Ubuntu 22.04 / Qt 6.5.3)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/apt.conf.d/20auto-upgrades
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            libpulse-dev

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: gcc_64
          modules: 'qtmultimedia'
          cache: true
          cache-key-prefix: 'install-qt-action-6.5.3'

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: |
          cmake --build build --config Release --parallel
