name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v2.2.0)'
        required: false
        default: ''

jobs:
  build-linux:
    name: Build Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/apt.conf.d/20auto-upgrades
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            libpulse-dev \
            zip

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: gcc_64
          modules: 'qtmultimedia'
          cache: true
          cache-key-prefix: 'install-qt-action-6.5.3'

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: |
          cmake --build build --config Release --parallel

      - name: Package Linux Binary
        run: |
          mkdir -p package/ApexCluster-Ubuntu-x86_64
          cp build/ApexClusterApp package/ApexCluster-Ubuntu-x86_64/
          chmod +x package/ApexCluster-Ubuntu-x86_64/ApexClusterApp
          echo '#!/bin/bash' > package/ApexCluster-Ubuntu-x86_64/run.sh
          echo 'DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' >> package/ApexCluster-Ubuntu-x86_64/run.sh
          echo '"$DIR/ApexClusterApp" "$@"' >> package/ApexCluster-Ubuntu-x86_64/run.sh
          chmod +x package/ApexCluster-Ubuntu-x86_64/run.sh
          cd package
          zip -r ../ApexCluster-Ubuntu-x86_64.zip ApexCluster-Ubuntu-x86_64
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexCluster-Ubuntu-x86_64
          path: ApexCluster-Ubuntu-x86_64.zip
          retention-days: 1

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt and Ninja via Homebrew
        run: |
          brew install qt qtmultimedia ninja

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix qtmultimedia)"

      - name: Build Application
        run: |
          cmake --build build --config Release --parallel

      - name: Package macOS Binary
        run: |
          mkdir -p package/ApexCluster-macOS
          cp build/ApexClusterApp package/ApexCluster-macOS/
          chmod +x package/ApexCluster-macOS/ApexClusterApp
          echo '#!/bin/bash' > package/ApexCluster-macOS/run.sh
          echo 'DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' >> package/ApexCluster-macOS/run.sh
          echo '"$DIR/ApexClusterApp" "$@"' >> package/ApexCluster-macOS/run.sh
          chmod +x package/ApexCluster-macOS/run.sh
          cd package
          zip -r ../ApexCluster-macOS.zip ApexCluster-macOS
          cd ..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexCluster-macOS
          path: ApexCluster-macOS.zip
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          arch: win64_msvc2019_64
          modules: 'qtmultimedia'
          mirror: 'https://download.qt.io'
          cache: true
          cache-key-prefix: 'install-qt-action-6.6.3-win-msvc2019'

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl

      - name: Build Application
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Qt Runtime and Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/ApexCluster-Windows-x64
          Copy-Item -Path build/ApexClusterApp.exe -Destination package/ApexCluster-Windows-x64/
          if (Get-Command windeployqt -ErrorAction SilentlyContinue) {
              windeployqt --qmldir qml package/ApexCluster-Windows-x64/ApexClusterApp.exe
          } elseif ($env:QT_ROOT -and (Test-Path "$env:QT_ROOT/bin/windeployqt.exe")) {
              & "$env:QT_ROOT/bin/windeployqt.exe" --qmldir qml package/ApexCluster-Windows-x64/ApexClusterApp.exe
          }
          Compress-Archive -Path package/ApexCluster-Windows-x64 -DestinationPath ApexCluster-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexCluster-Windows-x64
          path: ApexCluster-Windows-x64.zip
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.2.0")
          fi
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes and Version Updates
        run: |
          python3 scripts/generate_release_notes.py "${{ steps.version.outputs.VERSION }}"

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: List Release Assets
        run: |
          ls -lh release_assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "APEX Horizon Cluster HMI ${{ steps.version.outputs.VERSION }}"
          body_path: release_body.md
          files: release_assets/*.zip
          draft: false
          prerelease: false
